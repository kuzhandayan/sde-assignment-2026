# docker compose up --build              tests + public_01 + public_02 end to end, then the view on http://localhost:8800
# SCENARIOS="public_03_load" docker compose up     any scenarios you like
# docker compose run --rm dev <command>  run one command in the same image, e.g. scripts/crash_test.py
x-app: &app
  build: {context: ., args: {BASE_IMAGE: "${BASE_IMAGE:-python:3.12-slim}"}}
  working_dir: /repo
  # state/ (SQLite) lives in a Docker volume: SQLite's shared-memory files are not safe on macOS bind mounts
  volumes: [".:/repo", "state:/repo/state"]

services:
  app:
    <<: *app
    entrypoint: [scripts/demo.sh]
    environment: [SCENARIOS, VIEW_RELOAD=1]   # view restarts by itself when controller/ code changes
    ports: ["8800:8800"]
  dev:
    <<: *app
    entrypoint: [bash, -c, 'exec "$$@"', --]
    command: [python, -m, pytest, -q, tests]
    profiles: [dev]

volumes:
  state:
