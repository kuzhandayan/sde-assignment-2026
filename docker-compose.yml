# Local end-to-end run in Docker:  SCENARIO=public_02_incidents docker compose up --build
# Then:  docker compose run --rm controller why --db /app/state/controller.db --workflow ks_cancel --at "D4 18:00"
#        open http://127.0.0.1:8800 (supervisor view)
services:
  sim:
    build: {context: ., dockerfile: Dockerfile.sim, args: {BASE_IMAGE: "${BASE_IMAGE:-python:3.12-slim}"}}
    command: ["--scenario", "scenarios/${SCENARIO:-public_01_dev}.yaml", "--run-dir", "/app/runs/mine"]
    volumes: ["./runs/docker_${SCENARIO:-public_01_dev}:/app/runs"]
    ports: ["8700:8700"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8700/health')"]
      interval: 5s
      retries: 60
  controller:
    build: {context: ., args: {BASE_IMAGE: "${BASE_IMAGE:-python:3.12-slim}"}}
    command: ["run", "--url", "http://sim:8700", "--db", "/app/state/controller.db"]
    volumes: ["./state/docker_${SCENARIO:-public_01_dev}:/app/state"]
    depends_on: {sim: {condition: service_healthy}}
  view:
    build: {context: ., args: {BASE_IMAGE: "${BASE_IMAGE:-python:3.12-slim}"}}
    command: ["view", "--db", "/app/state/controller.db", "--host", "0.0.0.0", "--port", "8800"]
    volumes: ["./state/docker_${SCENARIO:-public_01_dev}:/app/state:ro"]
    ports: ["8800:8800"]
    depends_on: [controller]
    profiles: ["view"]
